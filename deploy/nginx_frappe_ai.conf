# 1) Route /ai/ to the backend. The trailing slash strips the /ai prefix.
#    Put this inside the site's `server { ... }` block, before `location /`.
location /ai/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;      # three base64 images
    proxy_read_timeout 90s;        # the model can be slow
}

